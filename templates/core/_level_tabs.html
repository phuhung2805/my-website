{% for tab in level_tabs %}{% if tab.locked %}<span title="Chưa mở khóa: hãy vượt qua bài thi nâng band" class="{{ tab_class }} font-extrabold text-white/40 cursor-not-allowed"><i class="fas fa-lock text-[8px]"></i> {{ tab.code }}</span>{% else %}<a href="{% url 'dashboard_level' level_code=tab.slug %}" class="{{ tab_class }} font-extrabold transition-all {% if active_level == tab.code %}bg-amber-400 text-brand-900 shadow-sm{% else %}text-white/70 hover:text-white hover:bg-white/10{% endif %}">{{ tab.code }}</a>{% endif %}{% endfor %}
